<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Meta Ray-Ban Display Web App: fixed 600x600, no scrolling (wearables.developer.meta.com/docs/develop/webapps/build/) -->
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="description" content="Vocab Lens: the German word for what you're looking at, with der/die/das colour-coded.">
<meta name="mrbd-web-app-capable" content="yes">
<title>Vocab Lens</title>
<link rel="icon" type="image/png" href="glasses-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonts load after first paint (media swap) so a slow link never blanks the screen; system rounded fonts stand in until then.
     text= asks Google Fonts for only the letters this app uses (A-Z, a-z, 0-9, äöüß and a little punctuation): small files over 500 Kbps. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Nunito:wght@700&display=swap&text=%20%2B-.%2F0123456789%3FABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz%C3%84%C3%96%C3%9C%C3%9F%C3%A4%C3%B6%C3%BC%C2%B7%E2%80%A6" media="print" onload="this.media='all'">
<style>
/* Same tokens as index.html's glasses panel (Version 7), so the glasses and the phone app are one product. */
:root {
  --text: #edf1ff; --muted: #9dabd1; --mint: #14c6a0; --sun: #ffc83d; --sun-d: #d49300; --on-sun: #3a2a00; --flame: #ff7a1a;
  --der: #5cc8ff; --die: #ff8fb8; --das: #ffd84a; --art-ink: #0b1530;
  --surface: rgba(205, 218, 255, .15); --line: rgba(150, 170, 230, .7);
  --f-display: "Fredoka", ui-rounded, system-ui, sans-serif; --f-body: "Nunito", ui-rounded, system-ui, sans-serif;
}
* { box-sizing: border-box; }
/* Additive display: pure black is see-through, only lit pixels show. */
html, body { margin: 0; width: 600px; height: 600px; overflow: hidden; background: #000; color: var(--text); font-family: var(--f-body); touch-action: none; -webkit-user-select: none; user-select: none; }
.scr { position: relative; width: 600px; height: 600px; text-shadow: 0 0 10px rgba(190, 210, 255, .35); }
svg.ic { width: 1.1em; height: 1.1em; fill: currentColor; flex: none; }

/* Status lives behind Up: one card at a time is what native Display apps do. */
.top { position: absolute; left: 30px; right: 30px; top: 26px; display: flex; align-items: center; gap: 10px; opacity: 0; transform: translateY(-10px); transition: opacity .25s, transform .25s; }
.top .lumi { width: 44px; height: 44px; }
.top b { font: 700 24px/1 var(--f-display); margin-right: auto; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 4px 12px; font: 700 22px/1.2 var(--f-display); }
.pill.flame { color: var(--flame); border-color: var(--flame); }
.pill.xp .ic { color: var(--sun); }
.prog { position: absolute; left: 30px; right: 30px; top: 88px; display: flex; align-items: center; gap: 12px; opacity: 0; transition: opacity .25s; }
.bar { flex: 1; height: 16px; border-radius: 99px; background: var(--surface); border: 2px solid var(--line); overflow: hidden; position: relative; }
.bar i { position: absolute; inset: 0; background: var(--mint); border-radius: 99px; transform-origin: left; transform: scaleX(0); transition: transform .5s; }
.prog output { font: 700 20px var(--f-display); color: var(--muted); }
body.peek .top { opacity: 1; transform: none; }
body.peek .prog { opacity: 1; }

/* Control hint, fades after a few seconds. */
.hint { position: absolute; left: 30px; right: 30px; bottom: 268px; display: flex; justify-content: center; gap: 18px; font: 700 18px var(--f-body); color: var(--muted); transition: opacity .6s; }
.hint.gone, body.peek .hint { opacity: 0; }
.k { display: inline-block; min-width: 26px; padding: 0 6px; margin-right: 4px; border: 2px solid var(--line); border-radius: 8px; font: 700 18px/24px var(--f-display); color: var(--text); text-align: center; text-shadow: none; }

/* The word card: frosted fill + soft glow, as in real Ray-Ban Display captures. */
.card { position: absolute; left: 30px; right: 30px; bottom: 34px; height: 214px; padding: 26px 26px 22px; display: flex; align-items: center; gap: 18px;
  background: linear-gradient(180deg, rgba(215, 226, 255, .22), rgba(190, 206, 255, .12)); border: 2px solid rgba(220, 230, 255, .6); border-radius: 30px;
  box-shadow: 0 0 30px rgba(170, 195, 255, .22), inset 0 1px 0 rgba(255, 255, 255, .22);
  outline: none; cursor: pointer; transition: border-color .2s; }
/* No backdrop-filter: on the glasses the only thing behind the card is black (see-through), so a blur costs paint and shows nothing. */
.card:focus-visible { border-color: #fff; box-shadow: 0 0 0 3px rgba(255, 255, 255, .28), 0 0 34px rgba(170, 195, 255, .3), inset 0 1px 0 rgba(255, 255, 255, .22); }
.txt { flex: 1; min-width: 0; transition: opacity .16s, transform .16s; }
.txt.out { opacity: 0; transform: translateY(8px); }
.kick { display: flex; align-items: center; gap: 8px; font: 700 20px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--mint); margin-bottom: 4px; }
.kick .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 8px var(--mint); animation: pulse 1.4s ease-in-out infinite; }
.kick .act { margin-left: auto; letter-spacing: .04em; text-transform: none; color: var(--muted); font-size: 18px; }
.kick.paused { color: var(--muted); }
.kick.paused .dot { background: var(--muted); box-shadow: none; animation: none; }
.kick.got { color: var(--sun); }
.kick.got .dot { background: var(--sun); box-shadow: 0 0 8px var(--sun); animation: none; }
.l1 { font: 700 74px/1.05 var(--f-display); white-space: nowrap; overflow: hidden; }
.l1.ask #noun { font-size: .62em; }
.art:empty { padding: 0; margin: 0; }
.art { display: inline-block; font-family: var(--f-display); font-weight: 700; color: var(--art-ink); padding: 0 .3em; border-radius: .32em; font-size: .62em; vertical-align: .22em; margin-right: .18em; text-shadow: none; }
.a-m { background: var(--der); } .a-f { background: var(--die); } .a-n { background: var(--das); }
.l2 { font: 700 24px/1.3 var(--f-body); color: #d8ffe9; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.burst { position: absolute; right: 22px; top: -22px; background: var(--sun); color: var(--on-sun); font: 700 24px var(--f-display); padding: 6px 16px; border-radius: 99px; box-shadow: 0 5px 0 var(--sun-d); text-shadow: none;
  opacity: 0; transform: rotate(4deg) scale(.4); transition: transform .25s cubic-bezier(.3, 1.6, .5, 1), opacity .2s; }
.burst.on { opacity: 1; transform: rotate(4deg) scale(1); }
.peek { position: absolute; left: 26px; top: -40px; width: 56px; height: 56px; transition: transform .3s cubic-bezier(.3, 1.6, .5, 1); }
.peek.hop { transform: translateY(-12px) rotate(-8deg); }
@keyframes pulse { 50% { opacity: .35; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="lumi" viewBox="0 0 64 64">
    <circle cx="19" cy="9" r="6" fill="#2a4fc0"/><circle cx="45" cy="9" r="6" fill="#2a4fc0"/>
    <rect x="5" y="16" width="54" height="46" rx="23" fill="#2a4fc0"/>
    <rect x="5" y="12" width="54" height="46" rx="23" fill="#4a7bff"/>
    <circle cx="32" cy="34" r="16" fill="#fff"/><circle cx="34" cy="35" r="9" fill="#14214a"/>
    <circle cx="38" cy="31" r="3.4" fill="#fff"/><circle cx="31" cy="39" r="1.6" fill="#fff"/>
    <path d="M10 28q-2 8 1 14" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12.5 2c.6 3.2-1.6 4.9-3.1 6.7C7.9 10.5 7 12 7 14a5.2 5.2 0 0 0 10.4.4c0-2-.9-3.2-1.8-4.3-.2 1.1-.8 1.9-1.7 2.1.5-3.5-.1-7.5-1.4-10.2z"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.5 2 5 13.5h5.6L9.5 22 19 9.8h-5.7z"/></symbol>
</svg>
<main class="scr">
  <div class="top">
    <svg class="lumi"><use href="#lumi"/></svg><b>Vocab Lens</b>
    <span class="pill flame"><svg class="ic"><use href="#i-flame"/></svg><span id="streak">7</span></span>
    <span class="pill xp"><svg class="ic"><use href="#i-bolt"/></svg><span id="xp">0</span></span>
  </div>
  <div class="prog"><div class="bar"><i id="barFill"></i></div><output id="count">0 / 100</output></div>
  <div class="hint" id="hint"><span><span class="k">&#9664;</span><span class="k">&#9654;</span>history</span><span><span class="k">&#9679;</span>collect</span><span><span class="k">&#9650;</span>stats</span></div>
  <div class="card" id="card" role="button" tabindex="0" aria-live="polite">
    <svg class="peek" id="lumiPeek"><use href="#lumi"/></svg>
    <div class="burst" id="burst">+10 XP</div>
    <div class="txt" id="txt">
      <!-- Text nodes are updated in place, never rebuilt: rebuilt elements count as fresh paints and keep pushing the startup metric out. -->
      <div class="kick" id="kick"><span class="dot"></span><span id="kickTxt">Looking</span><span class="act"><span id="where"></span><span class="k">&#9679;</span><span id="verb">collect</span></span></div>
      <div class="l1" id="l1"><span class="art" id="art"></span><span id="noun">&hellip;</span></div>
      <div class="l2" id="l2">&nbsp;</div>
    </div>
  </div>
</main>
<script>
"use strict";
// Web Apps get no camera, so this page plays a demo "walk": a new object is "spotted" every few seconds.
// Neural Band / simulator D-pad arrive as ArrowLeft/Right/Up/Down + Enter (input-and-navigation docs).
// ?demo=0 stops the walk; ?every=<seconds> changes its pace.
const qs = new URLSearchParams(location.search);
const EVERY = Math.max(2, Number(qs.get("every")) || 5) * 1000;
const AUTO = qs.get("demo") !== "0";
const IDLE_BACK_TO_LIVE = 10000;
const $ = (id) => document.getElementById(id);
const ART = { der: "a-m", die: "a-f", das: "a-n" };
// All 100 words inline as [id, en, de] (3.5 KB), generated from model/labels.json by scratchpad slim_words.py: no fetch at launch.
const WORDS = [["cup","cup","die Tasse"],["glass","drinking glass","das Glas"],["bottle","bottle","die Flasche"],["plate","plate","der Teller"],["bowl","bowl","die Schüssel"],["fork","fork","die Gabel"],["knife","knife","das Messer"],["spoon","spoon","der Löffel"],["frying-pan","frying pan","die Pfanne"],["pot","cooking pot","der Topf"],["kettle","kettle","der Wasserkocher"],["toaster","toaster","der Toaster"],["fridge","refrigerator","der Kühlschrank"],["microwave","microwave oven","die Mikrowelle"],["banana","banana","die Banane"],["apple","apple","der Apfel"],["orange","orange","die Orange"],["lemon","lemon","die Zitrone"],["bread","loaf of bread","das Brot"],["egg","egg","das Ei"],["tomato","tomato","die Tomate"],["carrot","carrot","die Karotte"],["onion","onion","die Zwiebel"],["potato","potato","die Kartoffel"],["pizza","pizza","die Pizza"],["cake","cake","der Kuchen"],["chair","chair","der Stuhl"],["table","table","der Tisch"],["sofa","sofa","das Sofa"],["bed","bed","das Bett"],["pillow","pillow","das Kissen"],["lamp","lamp","die Lampe"],["door","door","die Tür"],["window","window","das Fenster"],["mirror","mirror","der Spiegel"],["clock","clock","die Uhr"],["vase","vase","die Vase"],["plant","potted plant","die Topfpflanze"],["bookshelf","bookshelf","das Bücherregal"],["curtain","curtain","der Vorhang"],["tv","television","der Fernseher"],["toilet","toilet","die Toilette"],["sink","sink","das Waschbecken"],["toothbrush","toothbrush","die Zahnbürste"],["towel","towel","das Handtuch"],["umbrella","umbrella","der Regenschirm"],["key","key","der Schlüssel"],["scissors","scissors","die Schere"],["candle","candle","die Kerze"],["broom","broom","der Besen"],["laptop","laptop","der Laptop"],["keyboard","computer keyboard","die Tastatur"],["mouse","computer mouse","die Maus"],["monitor","computer monitor","der Bildschirm"],["phone","mobile phone","das Handy"],["headphones","headphones","der Kopfhörer"],["pen","pen","der Stift"],["book","book","das Buch"],["notebook","notebook","das Notizbuch"],["paper","sheet of paper","das Papier"],["backpack","backpack","der Rucksack"],["wallet","wallet","die Geldbörse"],["glasses","glasses","die Brille"],["calculator","calculator","der Taschenrechner"],["printer","printer","der Drucker"],["stapler","stapler","der Hefter"],["remote","remote control","die Fernbedienung"],["cable","cable","das Kabel"],["camera","camera","die Kamera"],["wristwatch","wristwatch","die Armbanduhr"],["car","car","das Auto"],["bicycle","bicycle","das Fahrrad"],["bus","bus","der Bus"],["motorcycle","motorcycle","das Motorrad"],["traffic-light","traffic light","die Ampel"],["stop-sign","stop sign","das Stoppschild"],["bench","park bench","die Bank"],["tree","tree","der Baum"],["flower","flower","die Blume"],["dog","dog","der Hund"],["cat","cat","die Katze"],["bird","bird","der Vogel"],["hydrant","fire hydrant","der Hydrant"],["street-lamp","street lamp","die Straßenlaterne"],["bridge","bridge","die Brücke"],["house","house","das Haus"],["boat","boat","das Boot"],["train","train","der Zug"],["airplane","airplane","das Flugzeug"],["shopping-bag","shopping bag","die Einkaufstasche"],["shoe","shoe","der Schuh"],["hat","hat","der Hut"],["tshirt","t-shirt","das T-Shirt"],["jacket","jacket","die Jacke"],["ball","ball","der Ball"],["guitar","guitar","die Gitarre"],["hammer","hammer","der Hammer"],["screwdriver","screwdriver","der Schraubenzieher"],["ladder","ladder","die Leiter"],["suitcase","suitcase","der Koffer"]];
const FIRST = ["cup", "laptop", "chair", "phone", "book", "bottle", "clock", "backpack", "glass", "umbrella"];

const store = {
  load() { try { return JSON.parse(localStorage.getItem("vl-glasses") || "null"); } catch (e) { return null; } },
  save(s) { try { localStorage.setItem("vl-glasses", JSON.stringify(s)); } catch (e) { /* storage may be off */ } },
};
const st = Object.assign({ xp: 340, streak: 7, got: [] }, store.load() || {});
let words = [], queue = [], hist = [], pos = -1, live = true, quiz = false;
let lastSpot = 0, lastInput = 0, peekUntil = 0, burstT = 0;

function parse([id, en, de]) {
  const sp = de.indexOf(" ");
  return { id, en, art: sp > 0 ? de.slice(0, sp) : "", noun: sp > 0 ? de.slice(sp + 1) : de };
}
function refill() {
  const seen = new Set(hist.map((h) => h.id));
  const rest = words.filter((w) => !FIRST.includes(w.id) && !seen.has(w.id));
  for (let i = rest.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
  const first = FIRST.map((id) => words.find((w) => w.id === id)).filter((w) => w && !seen.has(w.id));
  queue = first.concat(rest);
  if (!queue.length) queue = words.slice();
}
function spot(anim = true) {
  if (!queue.length) refill();
  const w = queue.shift();
  if (!w) return;
  hist.push(w);
  if (hist.length > 30) hist.shift();
  pos = hist.length - 1; quiz = false; lastSpot = Date.now();
  render(anim);
}
// One measure, one write (text width scales with font size), instead of a shrink-and-remeasure loop.
function fit() {
  const el = $("l1");
  el.style.fontSize = "74px";
  const over = el.scrollWidth / el.clientWidth;
  if (over > 1) el.style.fontSize = Math.max(36, Math.floor(74 / over)) + "px";
}
function render(anim) {
  const w = hist[pos];
  if (!w) return;
  const paint = () => {
    const got = st.got.includes(w.id);
    $("kick").className = "kick" + (live ? "" : " paused") + (got && !quiz ? " got" : "");
    $("kickTxt").textContent = quiz ? "Test yourself" : got ? "Collected" : live ? "Spotted" : "Seen";
    $("where").textContent = live ? "" : `${pos + 1}/${hist.length} · `;
    $("verb").textContent = quiz ? "reveal" : got ? "test" : "collect";
    $("l1").classList.toggle("ask", quiz);
    const art = quiz ? "" : w.art;
    $("art").textContent = art;
    $("art").className = "art" + (art ? " " + (ART[art] || "a-f") : "");
    $("noun").textContent = quiz ? "Wie heißt das?" : w.noun;
    $("l2").textContent = w.en;
    fit();
  };
  if (!anim) { paint(); return; }
  const t = $("txt");
  t.classList.add("out");
  setTimeout(() => { paint(); t.classList.remove("out"); }, 160);
}
function status() {
  $("xp").textContent = st.xp;
  $("streak").textContent = st.streak;
  const n = st.got.length, tot = words.length || 100;
  $("count").textContent = `${n} / ${tot}`;
  $("barFill").style.transform = `scaleX(${Math.min(1, n / tot)})`;
}
function setPeek(on, ms) {
  peekUntil = on ? (ms ? Date.now() + ms : Infinity) : 0;
  document.body.classList.toggle("peek", on);
}
function celebrate() {
  const b = $("burst"), l = $("lumiPeek");
  b.classList.add("on"); l.classList.add("hop");
  clearTimeout(burstT);
  burstT = setTimeout(() => { b.classList.remove("on"); l.classList.remove("hop"); }, 1100);
}
function select() {
  const w = hist[pos];
  if (!w) return;
  if (quiz) { quiz = false; render(false); return; }
  if (!st.got.includes(w.id)) {
    st.got.push(w.id); st.xp += 10; store.save(st);
    status(); celebrate(); setPeek(true, 2200); render(false);
  } else { quiz = true; render(false); }
}
function prev() { if (pos > 0) { pos--; live = false; quiz = false; render(true); } else if (live) { live = false; render(false); } }
function next() {
  if (pos < hist.length - 1) { pos++; quiz = false; render(true); }
  else if (!live) { live = true; render(false); }
}

// Back on the glasses calls history.back(). Quiz, history and pinned stats are "screens" with one history
// entry, so Back returns to the live view instead of closing the app; Back on the live view closes it.
let skipPop = false;
const inSub = () => quiz || !live || peekUntil === Infinity;
function syncHistory() {
  const has = !!(history.state && history.state.vl);
  if (inSub() && !has) history.pushState({ vl: 1 }, "");
  else if (!inSub() && has) { skipPop = true; history.back(); }
}
addEventListener("popstate", () => {
  if (skipPop) { skipPop = false; return; }
  quiz = false; setPeek(false);
  if (!live) { pos = hist.length - 1; live = true; }
  lastInput = Date.now();
  render(true);
});

addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === "ArrowLeft") prev();
  else if (k === "ArrowRight") next();
  else if (k === "ArrowUp") setPeek(true);
  else if (k === "ArrowDown") setPeek(false);
  else if (k === "Enter" || k === " ") select();
  else if (k === "Escape" && history.state && history.state.vl) { history.back(); }
  else return;
  lastInput = Date.now();
  $("hint").classList.add("gone");
  syncHistory();
  e.preventDefault(); // stop spatial navigation / scrolling stealing the keys
});
$("card").addEventListener("click", () => { lastInput = Date.now(); select(); syncHistory(); });

setInterval(() => {
  const now = Date.now();
  if (peekUntil && now > peekUntil) setPeek(false);
  if (document.hidden || !words.length) return;
  if (!live && now - lastInput > IDLE_BACK_TO_LIVE) { pos = hist.length - 1; live = true; quiz = false; render(true); syncHistory(); }
  if (AUTO && live && !quiz && now - lastSpot > EVERY && now - lastInput > EVERY) spot();
}, 250);
setTimeout(() => $("hint").classList.add("gone"), 9000);

// First paint needs no network: the inline words show a real card at once.
words = WORDS.map(parse);
status();
$("card").focus();
spot(false);
if (document.fonts) document.fonts.addEventListener("loadingdone", fit);
</script>
</body>
</html>
